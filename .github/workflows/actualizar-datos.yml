name: Actualizar datos

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write            # necesario para guardar data.json en el repo

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # la primera vez descarga el detalle de todos los enfrentamientos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Extraer datos de la federación
        run: python scripts/liga_padel.py --salida datos

      - name: Guardar data.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/data.json datos/jugadores.json datos/detalle.json datos/plantillas.json
          git diff --staged --quiet || git commit -m "Actualizar datos"
          git push
